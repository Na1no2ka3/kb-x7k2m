<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家計簿</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root {
  --bg: #f7f6f3;
  --surface: #ffffff;
  --border: rgba(0,0,0,0.08);
  --border-md: rgba(0,0,0,0.14);
  --text: #1a1a1a;
  --text-sub: #888;
  --text-hint: #bbb;
  --income: #1D9E75;
  --expense: #D85A30;
  --accent: #2c2c2c;
  --radius: 12px;
  --radius-sm: 8px;
  --mono: 'DM Mono', monospace;
  --sans: 'Noto Sans JP', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }

.app { max-width: 860px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border); }
.logo { font-size: 1.1rem; font-weight: 500; letter-spacing: .03em; }
.logo span { color: var(--text-sub); font-weight: 300; }
.header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1.5rem; }
.section-label { font-size: 11px; font-weight: 500; letter-spacing: .1em; color: var(--text-sub); text-transform: uppercase; margin-bottom: 12px; }

.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.25rem; }
.metric { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: .9rem 1.1rem; }
.metric-label { font-size: 11px; color: var(--text-sub); margin-bottom: 4px; letter-spacing: .04em; }
.metric-value { font-family: var(--mono); font-size: 1.4rem; font-weight: 500; }
.metric-value.inc { color: var(--income); }
.metric-value.exp { color: var(--expense); }
.metric-value.pos { color: var(--income); }
.metric-value.neg { color: var(--expense); }

.month-nav-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
.month-nav { display: flex; align-items: center; gap: 10px; }
.month-display { font-family: var(--mono); font-size: 1rem; font-weight: 500; min-width: 90px; text-align: center; }
.nav-btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border-md); background: var(--surface); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text); transition: background .15s; }
.nav-btn:hover { background: var(--bg); }

.btn { font-family: var(--sans); font-size: 13px; padding: 0 14px; height: 34px; border-radius: var(--radius-sm); border: 1px solid var(--border-md); background: var(--surface); color: var(--text); cursor: pointer; transition: background .15s; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--bg); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { opacity: .85; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

.form-grid { display: grid; grid-template-columns: 80px 1fr 110px; gap: 8px; margin-bottom: 8px; }
.form-grid2 { display: grid; grid-template-columns: 1fr 130px auto; gap: 8px; }
select, input[type=text], input[type=number], input[type=date] { font-family: var(--sans); font-size: 13px; height: 36px; padding: 0 10px; border: 1px solid var(--border-md); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); outline: none; transition: border-color .15s; width: 100%; }
select:focus, input:focus { border-color: var(--accent); }

.charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem; }
.chart-wrap { position: relative; width: 100%; height: 200px; }

.tx-list { max-height: 320px; overflow-y: auto; }
.tx-list::-webkit-scrollbar { width: 4px; }
.tx-list::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 2px; }
.tx-row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.tx-row:last-child { border-bottom: none; }
.tx-row.editing { background: var(--bg); border-radius: var(--radius-sm); padding: 10px; margin: 2px 0; border-bottom: none; flex-direction: column; align-items: stretch; }
.tx-date { font-family: var(--mono); font-size: 12px; color: var(--text-sub); min-width: 44px; }
.tx-badge { font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 500; min-width: 36px; text-align: center; }
.tx-badge.inc { background: #e6f5ef; color: var(--income); }
.tx-badge.exp { background: #faeee8; color: var(--expense); }
.tx-cat { font-size: 11px; color: var(--text-sub); min-width: 60px; }
.tx-desc { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-amount { font-family: var(--mono); font-size: 13px; font-weight: 500; min-width: 80px; text-align: right; }
.tx-amount.inc { color: var(--income); }
.tx-amount.exp { color: var(--expense); }
.ic-btn { background: none; border: none; cursor: pointer; font-size: 13px; padding: 2px 4px; color: var(--text-hint); line-height: 1; height: auto; border-radius: 4px; transition: color .15s, background .15s; }
.ic-btn:hover { color: var(--text); background: var(--bg); }
.ic-btn.del:hover { color: var(--expense); }

.edit-fields { display: grid; grid-template-columns: 70px 105px 95px 1fr 90px; gap: 6px; margin-bottom: 8px; }
.edit-fields select, .edit-fields input { height: 30px; font-size: 12px; background: var(--surface); }
.edit-actions { display: flex; gap: 6px; justify-content: flex-end; }
.edit-actions .btn { height: 30px; font-size: 12px; padding: 0 12px; }

.filter-tabs { display: flex; gap: 6px; }
.tab { font-size: 12px; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border-md); background: var(--surface); color: var(--text-sub); cursor: pointer; transition: all .15s; }
.tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.import-area { border: 1.5px dashed var(--border-md); border-radius: var(--radius-sm); padding: 1rem; text-align: center; cursor: pointer; transition: background .15s; }
.import-area:hover { background: var(--bg); }
.import-hint { font-size: 11px; color: var(--text-hint); margin-top: 6px; line-height: 1.6; }
.import-hint code { background: var(--bg); padding: 1px 5px; border-radius: 3px; font-family: var(--mono); font-size: 11px; }

.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-sub); }
.legend-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }

.toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; font-size: 13px; padding: 8px 20px; border-radius: var(--radius-sm); opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; z-index: 100; }
.toast.show { opacity: 1; }

.empty { text-align: center; padding: 2rem 0; font-size: 13px; color: var(--text-hint); }
.section + .section { margin-top: 1rem; }

/* ログイン画面 */
#login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; gap: 1.5rem; text-align: center; }
#login-screen h1 { font-size: 1.4rem; font-weight: 500; }
#login-screen p { font-size: 13px; color: var(--text-sub); }
#app-screen { display: none; }

.sync-status { font-size: 11px; color: var(--text-hint); display: flex; align-items: center; gap: 4px; }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-hint); }
.sync-dot.ok { background: var(--income); }
.sync-dot.saving { background: #BA7517; animation: pulse .8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.user-info { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-sub); }
.user-avatar { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border-md); }
</style>
</head>
<body>
<div class="app">

  <!-- ログイン画面 -->
  <div id="login-screen">
    <div class="logo" style="font-size:1.4rem;">家計簿 <span>/ kakeibo</span></div>
    <p>Googleアカウントでログインすると、<br>データがGoogle Driveに自動保存されます。</p>
    <div id="g_id_signin"></div>
    <p style="font-size:11px;color:var(--text-hint);">データはあなたのGoogle Driveにのみ保存されます</p>
  </div>

  <!-- メイン画面 -->
  <div id="app-screen">
    <div class="header">
      <div class="logo">家計簿 <span>/ kakeibo</span></div>
      <div class="header-actions">
        <div class="sync-status"><span class="sync-dot" id="sync-dot"></span><span id="sync-label">--</span></div>
        <button class="btn" id="export-btn">↓ CSV</button>
        <button class="btn" onclick="document.getElementById('csv-file').click()">↑ CSV</button>
        <input type="file" id="csv-file" accept=".csv" style="display:none;">
        <div class="user-info">
          <img class="user-avatar" id="user-avatar" src="" alt="">
          <span id="user-name"></span>
          <button class="btn" id="logout-btn">ログアウト</button>
        </div>
      </div>
    </div>

    <div class="month-nav-row">
      <div class="month-nav">
        <button class="nav-btn" id="prev-month">&#8249;</button>
        <div class="month-display" id="month-label"></div>
        <button class="nav-btn" id="next-month">&#8250;</button>
      </div>
    </div>

    <div class="metrics">
      <div class="metric"><div class="metric-label">収入</div><div class="metric-value inc" id="m-income">¥0</div></div>
      <div class="metric"><div class="metric-label">支出</div><div class="metric-value exp" id="m-expense">¥0</div></div>
      <div class="metric"><div class="metric-label">収支</div><div class="metric-value" id="m-balance">¥0</div></div>
    </div>

    <div class="card section">
      <div class="section-label">取引を追加</div>
      <div class="form-grid">
        <select id="type"><option value="income">収入</option><option value="expense">支出</option></select>
        <input type="text" id="desc" placeholder="内容">
        <select id="cat"></select>
      </div>
      <div class="form-grid2">
        <input type="number" id="amount" placeholder="金額 (¥)" min="0">
        <input type="date" id="date-in">
        <button class="btn primary" id="add-btn">追加</button>
      </div>
    </div>

    <div class="charts-grid section">
      <div class="card">
        <div class="section-label">カテゴリ別支出</div>
        <div class="chart-wrap"><canvas id="pie-chart" role="img" aria-label="カテゴリ別支出の円グラフ"></canvas></div>
        <div class="legend" id="pie-legend"></div>
      </div>
      <div class="card">
        <div class="section-label">月別収支推移</div>
        <div class="chart-wrap"><canvas id="bar-chart" role="img" aria-label="月別収支の棒グラフ"></canvas></div>
      </div>
    </div>

    <div class="card section">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div class="section-label" style="margin-bottom:0;">取引履歴</div>
        <div class="filter-tabs">
          <button class="tab active" data-filter="all">すべて</button>
          <button class="tab" data-filter="income">収入</button>
          <button class="tab" data-filter="expense">支出</button>
        </div>
      </div>
      <div class="tx-list" id="tx-list"></div>
    </div>

    <div class="card section">
      <div class="section-label">CSVで過去データを読み込む</div>
      <div class="import-area" id="drop-zone">
        <div style="font-size:13px;color:var(--text-sub);">CSVファイルをここにドロップ、またはボタンで選択</div>
        <div class="import-hint">
          カンマ区切り・タブ区切りどちらも対応。ヘッダー行を自動判定します。<br>
          対応列名：<code>名前/内容</code> <code>カテゴリ</code> <code>日付</code> <code>出費/金額</code>（種別列がない場合は支出として読み込みます）
        </div>
        <button class="btn" style="margin-top:10px;" onclick="document.getElementById('csv-file').click()">ファイルを選択</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CLIENT_ID = '655650500199-ldjrrg5p571fga739ir1sp9g17o4m9bn.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/drive.appdata';
const FILE_NAME = 'kakeibo_data.json';

const INCOME_CATS = ['給与','副収入','ボーナス','その他収入'];
const EXPENSE_CATS = ['食費','交通費','住居費','光熱費','娯楽','医療費','衣服','通信費','美容費','交際費','日用品費','その他支出'];
const ALL_CATS = [...INCOME_CATS, ...EXPENSE_CATS];
const CAT_COLORS = ['#3266ad','#1D9E75','#D85A30','#BA7517','#9F4EBB','#D4537E','#378ADD','#639922','#73726c'];

const now = new Date();
let viewMonth = now.getMonth(), viewYear = now.getFullYear();
let txFilter = 'all', nextId = 1, editingId = null;
let transactions = [];
let accessToken = null;
let driveFileId = null;
let saveTimer = null;

function p(n) { return String(n).padStart(2,'0'); }
function fmt(n) { return '¥' + Math.round(n).toLocaleString('ja-JP'); }
function monthKey(y, m) { return `${y}/${p(m+1)}`; }
function txMonth(tx) { return tx.date.substring(0, 7); }
function getMonthTx() { return transactions.filter(t => txMonth(t) === monthKey(viewYear, viewMonth)); }

function showToast(msg, ok=true) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = ok ? 'var(--accent)' : 'var(--expense)';
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500);
}

function setSyncStatus(state) {
  const dot = document.getElementById('sync-dot');
  const label = document.getElementById('sync-label');
  if (state === 'ok') { dot.className = 'sync-dot ok'; label.textContent = '保存済み'; }
  else if (state === 'saving') { dot.className = 'sync-dot saving'; label.textContent = '保存中…'; }
  else { dot.className = 'sync-dot'; label.textContent = '未保存'; }
}

// Google Identity Services
window.onGoogleLibraryLoad = () => {
  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: handleCredentialResponse,
    auto_select: true,
  });
  google.accounts.id.renderButton(document.getElementById('g_id_signin'), {
    theme: 'outline', size: 'large', text: 'signin_with', locale: 'ja'
  });
  google.accounts.id.prompt();
};

function handleCredentialResponse(response) {
  const payload = JSON.parse(atob(response.credential.split('.')[1]));
  document.getElementById('user-name').textContent = payload.name;
  document.getElementById('user-avatar').src = payload.picture;
  requestAccessToken();
}

function requestAccessToken() {
  const client = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: async (tokenResponse) => {
      if (tokenResponse.error) { showToast('認証エラー', false); return; }
      accessToken = tokenResponse.access_token;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';
      await loadFromDrive();
      renderAll();
    },
  });
  client.requestAccessToken({ prompt: '' });
}

document.getElementById('logout-btn').addEventListener('click', () => {
  google.accounts.id.disableAutoSelect();
  accessToken = null; driveFileId = null; transactions = [];
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  showToast('ログアウトしました');
});

// Drive API
async function driveRequest(method, url, body=null, isJson=true) {
  const headers = { 'Authorization': `Bearer ${accessToken}` };
  if (isJson && body) headers['Content-Type'] = 'application/json';
  const res = await fetch(url, { method, headers, body: body ? (isJson ? JSON.stringify(body) : body) : null });
  if (!res.ok) throw new Error(`Drive API error: ${res.status}`);
  return res;
}

async function loadFromDrive() {
  setSyncStatus('saving');
  try {
    const res = await driveRequest('GET', `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${FILE_NAME}'&fields=files(id,name)`);
    const data = await res.json();
    if (data.files && data.files.length > 0) {
      driveFileId = data.files[0].id;
      const fileRes = await driveRequest('GET', `https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`);
      const json = await fileRes.json();
      transactions = json.transactions || [];
      nextId = json.nextId || (transactions.length > 0 ? Math.max(...transactions.map(t=>t.id)) + 1 : 1);
      showToast('データを読み込みました');
    } else {
      transactions = []; nextId = 1;
      showToast('新しい家計簿を作成しました');
    }
    setSyncStatus('ok');
  } catch(e) {
    setSyncStatus(''); showToast('データ読み込みエラー', false);
  }
}

async function saveToDrive() {
  if (!accessToken) return;
  setSyncStatus('saving');
  const payload = JSON.stringify({ transactions, nextId });
  try {
    if (driveFileId) {
      await driveRequest('PATCH',
        `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`,
        payload, false
      );
    } else {
      const meta = await driveRequest('POST',
        'https://www.googleapis.com/drive/v3/files',
        { name: FILE_NAME, parents: ['appDataFolder'] }
      );
      const metaJson = await meta.json();
      driveFileId = metaJson.id;
      await driveRequest('PATCH',
        `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`,
        payload, false
      );
    }
    setSyncStatus('ok');
  } catch(e) {
    setSyncStatus(''); showToast('保存エラー', false);
  }
}

function scheduleSave() {
  setSyncStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToDrive, 1000);
}

// UI
const catSel = document.getElementById('cat');
const typeSel = document.getElementById('type');
function updateCats() {
  const cats = typeSel.value === 'income' ? INCOME_CATS : EXPENSE_CATS;
  catSel.innerHTML = cats.map(c => `<option>${c}</option>`).join('');
}
typeSel.addEventListener('change', updateCats);
updateCats();

const dateIn = document.getElementById('date-in');
dateIn.value = `${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())}`;

document.getElementById('add-btn').addEventListener('click', () => {
  const type = typeSel.value, desc = document.getElementById('desc').value.trim();
  const cat = catSel.value, amount = parseFloat(document.getElementById('amount').value);
  const rawDate = dateIn.value.trim();
  if (!desc || !amount || amount <= 0 || !rawDate) { showToast('すべての項目を入力してください', false); return; }
  const date = rawDate.replace(/-/g, '/');
  transactions.push({ id: nextId++, type, desc, cat, amount, date });
  document.getElementById('desc').value = '';
  document.getElementById('amount').value = '';
  renderAll(); scheduleSave(); showToast('追加しました');
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active'); txFilter = tab.dataset.filter; renderList();
  });
});

document.getElementById('prev-month').addEventListener('click', () => {
  viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } renderAll();
});
document.getElementById('next-month').addEventListener('click', () => {
  viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } renderAll();
});

function renderList() {
  const txs = getMonthTx().filter(t => txFilter === 'all' || t.type === txFilter);
  const list = document.getElementById('tx-list');
  if (!txs.length) { list.innerHTML = '<div class="empty">取引がありません</div>'; editingId = null; return; }
  const sorted = [...txs].sort((a, b) => b.date.localeCompare(a.date));
  list.innerHTML = sorted.map(tx => {
    if (tx.id === editingId) {
      const catOpts = ALL_CATS.map(c => `<option value="${c}"${c===tx.cat?' selected':''}>${c}</option>`).join('');
      return `<div class="tx-row editing" data-id="${tx.id}">
        <div class="edit-fields">
          <select class="ed-type"><option value="income"${tx.type==='income'?' selected':''}>収入</option><option value="expense"${tx.type==='expense'?' selected':''}>支出</option></select>
          <input class="ed-date" type="date" value="${tx.date.replace(/\//g,'-')}">
          <select class="ed-cat">${catOpts}</select>
          <input class="ed-desc" type="text" value="${tx.desc}">
          <input class="ed-amount" type="number" value="${tx.amount}" min="0">
        </div>
        <div class="edit-actions">
          <button class="btn primary save-btn" data-id="${tx.id}">保存</button>
          <button class="btn cancel-btn" data-id="${tx.id}">キャンセル</button>
        </div>
      </div>`;
    }
    return `<div class="tx-row" data-id="${tx.id}">
      <span class="tx-date">${tx.date.slice(5)}</span>
      <span class="tx-badge ${tx.type==='income'?'inc':'exp'}">${tx.type==='income'?'収入':'支出'}</span>
      <span class="tx-cat">${tx.cat}</span>
      <span class="tx-desc">${tx.desc}</span>
      <span class="tx-amount ${tx.type==='income'?'inc':'exp'}">${tx.type==='income'?'+':'-'}${fmt(tx.amount)}</span>
      <button class="ic-btn edit-btn" data-id="${tx.id}" title="編集">✎</button>
      <button class="ic-btn del" data-id="${tx.id}" title="削除">✕</button>
    </div>`;
  }).join('');

  list.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => { editingId = parseInt(btn.dataset.id); renderList(); });
  });
  list.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', () => {
      if (editingId === parseInt(btn.dataset.id)) editingId = null;
      transactions = transactions.filter(t => t.id != btn.dataset.id);
      renderAll(); scheduleSave();
    });
  });
  list.querySelectorAll('.save-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const row = btn.closest('.tx-row');
      const type = row.querySelector('.ed-type').value;
      const date = row.querySelector('.ed-date').value.trim().replace(/-/g, '/');
      const cat = row.querySelector('.ed-cat').value;
      const desc = row.querySelector('.ed-desc').value.trim();
      const amount = parseFloat(row.querySelector('.ed-amount').value);
      if (!desc || !date || isNaN(amount) || amount <= 0) { showToast('入力内容を確認してください', false); return; }
      const idx = transactions.findIndex(t => t.id === editingId);
      if (idx > -1) transactions[idx] = { ...transactions[idx], type, date, cat, desc, amount };
      editingId = null; renderAll(); scheduleSave(); showToast('更新しました');
    });
  });
  list.querySelectorAll('.cancel-btn').forEach(btn => {
    btn.addEventListener('click', () => { editingId = null; renderList(); });
  });
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 1) return 0;

  // 区切り文字を自動判定（タブ or カンマ）
  const delim = lines[0].includes('\t') ? '\t' : ',';
  const splitLine = line => line.split(delim).map(c => c.trim().replace(/^"|"$/g, ''));

  const headers = splitLine(lines[0]).map(h => h.toLowerCase());
  const hasHeader = headers.some(h => /名前|カテゴリ|日付|出費|金額|内容|種別|date|amount|type/i.test(h));
  const start = hasHeader ? 1 : 0;

  // ヘッダーから列インデックスを推定
  const idxOf = (...keys) => { for (const k of keys) { const i = headers.findIndex(h => h.includes(k)); if (i >= 0) return i; } return -1; };
  const iDate   = hasHeader ? idxOf('日付','date')         : -1;
  const iType   = hasHeader ? idxOf('種別','type')         : -1;
  const iCat    = hasHeader ? idxOf('カテゴリ','cat')      : -1;
  const iDesc   = hasHeader ? idxOf('名前','内容','desc')  : -1;
  const iAmount = hasHeader ? idxOf('出費','金額','amount'): -1;

  let added = 0;
  for (let i = start; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const cols = splitLine(lines[i]);

    let date, type, cat, desc, amount;

    if (hasHeader && iDate >= 0) {
      // ヘッダーがある場合：列名で対応
      date   = (cols[iDate]   || '').replace(/-/g, '/');
      type   = (cols[iType]   || 'expense').toLowerCase();
      cat    = cols[iCat]    || 'その他';
      desc   = cols[iDesc]   || '';
      amount = parseFloat((cols[iAmount] || '').replace(/,/g, ''));
    } else {
      // ヘッダーなし：従来フォーマット 日付,種別,カテゴリ,内容,金額
      if (cols.length < 4) continue;
      [date, type, cat, desc, amount] = cols;
      date = (date || '').replace(/-/g, '/');
      amount = parseFloat((amount || '').replace(/,/g, ''));
    }

    // 種別の正規化
    if (type === '収入') type = 'income';
    else if (type === '支出' || type === 'expense' || !['income','expense'].includes(type)) type = 'expense';

    if (!date || !desc || isNaN(amount) || amount <= 0) continue;
    // 「2026年4月22日」形式を変換
    date = date.replace(/(\d{4})年(\d{1,2})月(\d{1,2})日?/, (_, y, m, d) => `${y}/${p(m)}/${p(d)}`);
    // 「2026/3/6」や「2026-3-6」形式をゼロ埋め正規化
    date = date.replace(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/, (_, y, m, d) => `${y}/${p(m)}/${p(d)}`);
    transactions.push({ id: nextId++, type, desc, cat: cat || 'その他', amount, date });
    added++;
  }
  return added;
}

function handleFile(file) {
  if (!file || !file.name.endsWith('.csv')) { showToast('CSVファイルを選択してください', false); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const n = parseCSV(e.target.result);
    if (n > 0) { showToast(`${n}件を読み込みました`); renderAll(); scheduleSave(); }
    else showToast('有効なデータが見つかりませんでした', false);
  };
  reader.readAsText(file, 'UTF-8');
}

document.getElementById('csv-file').addEventListener('change', e => handleFile(e.target.files[0]));
const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.style.background = 'var(--bg)'; });
dz.addEventListener('dragleave', () => dz.style.background = '');
dz.addEventListener('drop', e => { e.preventDefault(); dz.style.background = ''; handleFile(e.dataTransfer.files[0]); });

document.getElementById('export-btn').addEventListener('click', () => {
  const rows = ['\uFEFF日付,種別,カテゴリ,内容,金額'];
  [...transactions].sort((a, b) => a.date.localeCompare(b.date)).forEach(t => {
    rows.push(`${t.date},${t.type==='income'?'収入':'支出'},${t.cat},"${t.desc}",${t.amount}`);
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8;' }));
  a.download = `家計簿_${viewYear}年.csv`; a.click();
  showToast('CSVをエクスポートしました');
});

function renderMetrics() {
  const txs = getMonthTx();
  const inc = txs.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
  const exp = txs.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
  const bal = inc - exp;
  document.getElementById('m-income').textContent = fmt(inc);
  document.getElementById('m-expense').textContent = fmt(exp);
  const bEl = document.getElementById('m-balance');
  bEl.textContent = fmt(bal); bEl.className = 'metric-value ' + (bal >= 0 ? 'pos' : 'neg');
}

let pieChart, barChart;
function renderPie() {
  const txs = getMonthTx().filter(t => t.type === 'expense');
  const catMap = {}; txs.forEach(t => { catMap[t.cat] = (catMap[t.cat] || 0) + t.amount; });
  const labels = Object.keys(catMap), data = labels.map(l => catMap[l]);
  const colors = labels.map((_, i) => CAT_COLORS[i % CAT_COLORS.length]);
  const total = data.reduce((s, v) => s + v, 0);
  document.getElementById('pie-legend').innerHTML = labels.length
    ? labels.map((l, i) => `<div class="legend-item"><span class="legend-dot" style="background:${colors[i]}"></span>${l} ${total > 0 ? Math.round(data[i]/total*100) : 0}%</div>`).join('')
    : '<span style="font-size:12px;color:var(--text-hint)">支出なし</span>';
  const ctx = document.getElementById('pie-chart');
  if (pieChart) pieChart.destroy();
  if (!labels.length) return;
  pieChart = new Chart(ctx, { type: 'doughnut', data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${fmt(c.raw)}` } } } } });
}

function renderBar() {
  const months = [];
  for (let i = 5; i >= 0; i--) { const d = new Date(viewYear, viewMonth - i, 1); months.push({ y: d.getFullYear(), m: d.getMonth() }); }
  const labels = months.map(({ m }) => `${m+1}月`);
  const incs = months.map(({ y, m }) => transactions.filter(t => t.type === 'income' && txMonth(t) === monthKey(y, m)).reduce((s, t) => s + t.amount, 0));
  const exps = months.map(({ y, m }) => transactions.filter(t => t.type === 'expense' && txMonth(t) === monthKey(y, m)).reduce((s, t) => s + t.amount, 0));
  const ctx = document.getElementById('bar-chart');
  if (barChart) barChart.destroy();
  barChart = new Chart(ctx, { type: 'bar', data: { labels, datasets: [{ label: '収入', data: incs, backgroundColor: '#5DCAA5', borderRadius: 4 }, { label: '支出', data: exps, backgroundColor: '#F0997B', borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${fmt(c.raw)}` } } }, scales: { x: { grid: { display: false }, ticks: { font: { size: 11 }, autoSkip: false } }, y: { grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { font: { size: 10 }, callback: v => '¥' + Math.round(v/1000) + 'k' } } } } });
}

function renderAll() {
  document.getElementById('month-label').textContent = `${viewYear} / ${p(viewMonth+1)}`;
  renderMetrics(); renderList(); renderPie(); renderBar();
}
</script>
